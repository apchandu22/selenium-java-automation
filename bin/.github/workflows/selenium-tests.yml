name: Selenium Java Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Run Selenium TestNG suite
        run: mvn clean test
